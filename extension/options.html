<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Coclico AdBlock - Options</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; max-width: 720px; color: #eee; background: radial-gradient(120% 90% at 85% -10%, #2a1420 0%, #141019 45%, #0b0c12 100%); min-height: 100vh; }
  h1 { font-family: Georgia, serif; font-style: italic; }
  h1 { font-size: 20px; }
  h2 { font-size: 15px; margin-top: 24px; }
  label { display: block; margin: 6px 0; }
  textarea { width: 100%; height: 110px; background: #0d0d14; color: #eee; border: 1px solid #333; border-radius: 6px; font-family: monospace; }
  button { background: linear-gradient(90deg, #ff4136, #ff7a1f, #ffb020); color: #16090a; font-weight: 700; border: 0; padding: 10px 18px; border-radius: 11px; cursor: pointer; font-size: 14px; }
  .meta { color: #888; font-size: 12px; }
  input[type=text] { width: 100%; background: #0d0d14; color: #eee; border: 1px solid #333; border-radius: 6px; padding: 8px; }
</style>
</head>
<body>
  <h1>Coclico AdBlock</h1>
  <p class="meta" id="meta"></p>

  <h2>Listes de filtres actives</h2>
  <div id="lists"></div>

  <h2>Filtres personnalisés (format Adblock Plus, un par ligne)</h2>
  <textarea id="customFilters" placeholder="||exemple.com^"></textarea>

  <h2>Sites autorisés (un domaine par ligne)</h2>
  <input type="text" id="whitelist" placeholder="exemple.com">

  <p style="margin-top:20px"><button id="save">Enregistrer</button> <button id="refresh" style="background:#444">Recharger les listes maintenant</button></p>
  <p class="meta" id="saved"></p>

  <script src="filters.js"></script>
  <script src="options.js"></script>
</body>
</html>
